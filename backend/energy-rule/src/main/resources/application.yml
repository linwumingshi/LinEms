server:
  port: 8116

spring:
  application:
    name: energy-rule
  config:
    import: nacos:energy-shared.yaml?group=ENERGY
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/es_rule?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      # MySQL 不可用时允许服务先启动（规则缓存加载失败等下次刷新，不阻塞消费）
      initialization-fail-timeout: -1
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
  cloud:
    nacos:
      username: ${NACOS_USERNAME}
      password: ${NACOS_PASSWORD}
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: public
        group: ENERGY
      config:
        server-addr: 127.0.0.1:8848
        namespace: public

mybatis-plus:
  type-enums-package: com.energyx.common.enums
  global-config:
    banner: false
    db-config:
      id-type: assign_id
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

energyx:
  rule:
    node-id: rule-1
    kafka-bootstrap-servers: 127.0.0.1:9092
    consumer-threads: 4
    poll-ms: 200
    rule-cache-refresh-ms: 30000
    rule-cache-initial-delay-ms: 10000
    executor-core-size: 4
    executor-max-size: 16
    executor-queue-capacity: 1000
    webhook-timeout-ms: 5000
    nest-max-depth: 5

logging:
  level:
    com.energyx: info

# ---------------- 可观测性（Prometheus 指标端点，O-01） ----------------
management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info
  endpoint:
    health:
      probes:
        enabled: true

# ---------------- xxl-job 执行器（定时触发，Phase 11 §10） ----------------
xxl:
  job:
    admin:
      addresses: http://127.0.0.1:8099/xxl-job-admin
    accessToken: energyx-xxl-job-token
    executor:
      appname: energyx-rule
      address: ''
      ip: ''
      port: 9996
      logpath: ./logs/xxl-job/
      logretentiondays: 30
