server:
  port: 8101

spring:
  application:
    name: energy-system
  config:
    import: nacos:energy-shared.yaml?group=ENERGY
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/es_system?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
  kafka:
    bootstrap-servers: 127.0.0.1:9092
  flyway:
    enabled: true
    # baseline-on-migrate + baseline-version=0：种子库（sql/mysql/*.sql）上 V1~V3 幂等可安全重放，
    # V3 加列采用 INFORMATION_SCHEMA 幂等判断（见 V3__menu_columns_and_seed.sql），
    # 「手工种子建库」与「全新空库由 Flyway 全建」两条路径收敛。
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    encoding: UTF-8
  cloud:
    nacos:
      username: ${NACOS_USERNAME}
      password: ${NACOS_PASSWORD}
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: public
        group: ENERGY
      config:
        server-addr: 127.0.0.1:8848
        namespace: public

# ---- P0-1 网关鉴权：JWT 配置（HS 系列，算法由密钥长度决定；secret ≥32 字节；生产须经环境变量注入，见 P0-4） ----
energyx:
  jwt:
    expire-seconds: 7200
    issuer: energyx-ems

mybatis-plus:
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.energyx: info
