# =====================================================================
# EnergyX 储能管理平台 · 本地依赖环境
# Phase 3：Nacos / Redis / Kafka / Elasticsearch / TDengine
# 说明：默认复用本机 MySQL 8.4.6（127.0.0.1:3306，es_* 库已建）；
#       需要纯净 Docker MySQL 时取消下方 mysql 服务注释。
# 使用：docker compose up -d
# =====================================================================
services:
  kafka:
    # 本机无 Docker Hub 拉取条件（国内网络），改用本地 apache/kafka:4.1.2 官方镜像（KRaft 单节点）
    image: apache/kafka:4.1.2
    container_name: ems-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://127.0.0.1:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
    restart: unless-stopped

  elasticsearch:
    image: elasticsearch:8.17.0
    container_name: ems-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9300:9300"
    restart: unless-stopped

  tdengine:
    image: tdengine/tdengine:3.3.1.0
    container_name: ems-tdengine
    ports:
      - "6030:6030"   # 原生 TCP（JDBC 连接）
      - "6041:6041"   # RESTful HTTP
    restart: unless-stopped