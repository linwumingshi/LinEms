# =====================================================================
# EnergyX 储能管理平台 · 本地依赖环境
# Phase 3：Nacos / Redis / Kafka / Elasticsearch / TDengine
# 说明：默认复用本机 MySQL 8.4.6（127.0.0.1:3306，es_* 库已建）；
#       需要纯净 Docker MySQL 时取消下方 mysql 服务注释。
# 使用：docker compose up -d
# =====================================================================
services:
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: ems-nacos
    environment:
      - MODE=standalone
      - NACOS_AUTH_ENABLE=false
    ports:
      - "8848:8848"   # 控制台/HTTP
      - "9848:9848"   # gRPC（Nacos 2.x 客户端必需）
    restart: unless-stopped

  redis:
    image: redis/redis-stack-server:latest
    container_name: ems-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    restart: unless-stopped

  kafka:
    # 本机无 Docker Hub 拉取条件（国内网络），改用本地 apache/kafka:4.1.2 官方镜像（KRaft 单节点）
    image: apache/kafka:4.1.2
    container_name: ems-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://127.0.0.1:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
    restart: unless-stopped

  elasticsearch:
    image: elasticsearch:8.17.0
    container_name: ems-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9300:9300"
    restart: unless-stopped

  tdengine:
    image: tdengine/tdengine:3.3.1.0
    container_name: ems-tdengine
    ports:
      - "6030:6030"   # 原生 TCP（JDBC 连接）
      - "6041:6041"   # RESTful HTTP
    restart: unless-stopped

  # mysql:
  #   image: mysql:8.0
  #   container_name: ems-mysql
  #   environment:
  #     - MYSQL_ROOT_PASSWORD=***
  #   ports:
  #     - "3306:3306"
  #   volumes:
  #     - ./init:/docker-entrypoint-initdb.d   # 首次启动自动执行 sql/mysql/*.sql
  #   command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
  #   restart: unless-stopped

  xxl-job-admin:
    # xxl-job 调度中心：复用本机 MySQL（127.0.0.1:3306）的 xxl_job 库
    image: xuxueli/xxl-job-admin:2.4.1
    container_name: ems-xxl-job-admin
    environment:
      # PARAMS 中 root&QAQ 的 & 在 shell 变量展开后仅作普通字符，无需转义（word expansion 不再做语法解析）
      # accessToken 必须与 6 个执行器模块 application.yml 的 xxl.job.accessToken 一致（energyx-xxl-job-token）
      PARAMS: '--spring.datasource.url=jdbc:mysql://host.docker.internal:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai --spring.datasource.username=root --spring.datasource.password=root&QAQ --xxl.job.accessToken=energyx-xxl-job-token'
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 容器内解析宿主机 IP（Windows/macOS 可省，Linux 必需）
    ports:
      - "8099:8080"
    restart: unless-stopped
